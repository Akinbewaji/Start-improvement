<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f6f5ee" />
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#292a23");
        }
      } catch (e) {}
    </script>
    <!--seo-->
    <title>start.ng · Good vibes. Good games.</title>
    <meta name="description" content="Nigeria's home for free browser games. Play Naija-themed web games like Danfo Defense and Jollof Rush, no download. Built by the HNG community." />
    <!--/seo-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
